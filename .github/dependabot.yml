version: 2
updates:
  - package-ecosystem: npm
    directory: /
    open-pull-requests-limit: 3
    schedule:
      interval: weekly
      day: monday
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /mcp-server
    open-pull-requests-limit: 3
    schedule:
      interval: weekly
      day: monday
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker-compose
    directory: /
    open-pull-requests-limit: 3
    schedule:
      interval: weekly
      day: monday
  - package-ecosystem: github-actions
    directory: /
    open-pull-requests-limit: 3
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ['*']
