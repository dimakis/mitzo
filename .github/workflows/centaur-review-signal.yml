name: Centaur review signal

on:
  pull_request_review:
    types: [submitted, edited, dismissed]

# This event executes PR-controlled workflow code. It has no status-write token,
# secrets, checkout, artifacts, or code that the trusted workflow will execute.
permissions:
  contents: read

jobs:
  signal:
    runs-on: ubuntu-latest
    steps:
      - run: ':'
