name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

# Isolate PR candidates from slow older-run shutdown; same-candidate reruns supersede.
# Accepted default-branch recovery cleans up provably older PR heads.
concurrency:
  group: ci-${{ github.event.pull_request.number && format('{0}-{1}', github.event.pull_request.number, github.sha) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Compiled artifacts bind the exact Node version; runner caches must agree.
env:
  MITZO_CI_NODE_VERSION: '24.22.1'

jobs:
  changes:
    name: Select CI jobs
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      browser: ${{ steps.select.outputs.browser }}
      native: ${{ steps.select.outputs.native }}
      prepared: ${{ steps.select.outputs.prepared }}
      ordinary: ${{ steps.select.outputs.ordinary }}
    steps:
      - uses: actions/checkout@v7
      - name: Select dependent checks
        id: select
        uses: actions/github-script@v9
        with:
          script: |
            const { selectCiJobs } = await import(
              '${{ github.workspace }}/scripts/ci-selection.mjs'
            );
            let files = [];
            let complete = false;
            if (context.eventName === 'pull_request') {
              try {
                files = await github.paginate(github.rest.pulls.listFiles, {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: context.issue.number,
                  per_page: 100,
                });
                complete = files.length === context.payload.pull_request.changed_files;
              } catch (error) {
                core.warning(`Could not read complete PR diff; running all jobs: ${error.message}`);
              }
            }
            const selected = selectCiJobs({ eventName: context.eventName, files, complete });
            for (const [job, run] of Object.entries(selected)) {
              core.setOutput(job, String(run));
              core.info(`${job}: ${run ? 'run' : 'no dependent changes'}`);
            }

  # Fail before admitting the expensive matrices; keep independent diagnostics.
  preflight:
    name: Compile and source preflight
    runs-on: ubuntu-latest
    outputs:
      build_artifact_id: ${{ steps.compiled-output.outputs.artifact-id }}
      workspace_artifact_id: ${{ steps.workspace-output.outputs.artifact-id }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-node
        with:
          node-version: ${{ env.MITZO_CI_NODE_VERSION }}
      - name: Compile server and verify reviewed runtime artifacts
        id: preflight-build-server
        if: ${{ !cancelled() }}
        run: npm run build:server
      - name: Check every server source including test mocks
        id: preflight-typecheck-server
        if: ${{ !cancelled() }}
        run: npx tsc --noEmit
      - name: Check frontend sources
        id: preflight-typecheck-frontend
        if: ${{ !cancelled() }}
        run: cd frontend && npx tsc -b
      - name: Check registered source pins independently of compiled output
        id: preflight-source-pins
        if: ${{ !cancelled() }}
        run: npm run check:source-artifacts
      - name: Test native cold-boot orchestration with offline process fixtures
        if: ${{ !cancelled() }}
        run: python3 scripts/test-native-notification-boot.py
      - name: Verify candidate-bound build transfer rejection tests
        if: ${{ !cancelled() }}
        run: python3 scripts/test-ci-build-output.py
      - name: Package verified server outputs for this candidate
        run: python3 scripts/ci-build-output.py pack server "$RUNNER_TEMP/ci-server.zip"
      - name: Publish immutable server output
        id: compiled-output
        uses: actions/upload-artifact@v7
        with:
          name: ci-server-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-server.zip
          if-no-files-found: error
          retention-days: 7
      - name: Package generated workspace outputs for portable consumers
        run: python3 scripts/ci-build-output.py pack workspace "$RUNNER_TEMP/ci-workspace.zip"
      - name: Publish immutable generated workspace output
        id: workspace-output
        uses: actions/upload-artifact@v7
        with:
          name: ci-workspace-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-workspace.zip
          if-no-files-found: error
          retention-days: 7

  # Build ordinary and iOS-mode web assets beside server preflight.
  frontend-build:
    name: Build shared frontend assets
    needs: [changes]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      build_artifact_id: ${{ steps.compiled-output.outputs.artifact-id }}
      ios_web_artifact_id: ${{ steps.ios-web-output.outputs.artifact-id }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-node
        with:
          node-version: ${{ env.MITZO_CI_NODE_VERSION }}
      - name: Compile frontend workspace dependencies
        run: npx tsc -b packages/protocol packages/harness packages/client
      - name: Build frontend once for Linux CI consumers
        id: build
        if: ${{ !cancelled() }}
        env:
          MITZO_BUILD_EVIDENCE_DIR: ${{ runner.temp }}/mitzo-production-bundle
        run: npm run build
      - name: Retain exact production frontend
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          MITZO_BUILD_EVIDENCE_DIR: ${{ runner.temp }}/mitzo-production-bundle
          MITZO_PR_HEAD: ${{ github.event.pull_request.head.sha }}
          MITZO_PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: node scripts/retain-production-bundle.mjs
      - name: Upload exact production frontend
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: production-frontend-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mitzo-production-bundle
          if-no-files-found: error
      - name: Package verified frontend outputs for this candidate
        run: python3 scripts/ci-build-output.py pack frontend "$RUNNER_TEMP/ci-frontend.zip"
      - name: Publish immutable frontend output
        id: compiled-output
        uses: actions/upload-artifact@v7
        with:
          name: ci-frontend-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-frontend.zip
          if-no-files-found: error
          retention-days: 7
      - name: Build distinct iOS-mode web assets before native synchronization
        if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.native == 'true') }}
        run: cd frontend && npx tsc -b && npx vite build --mode ios --outDir dist-ios
      - name: Package generated iOS web assets
        if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.native == 'true') }}
        run: python3 scripts/ci-build-output.py pack ios-web "$RUNNER_TEMP/ci-ios-web.zip"
      - name: Publish immutable iOS web output
        if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.native == 'true') }}
        id: ios-web-output
        uses: actions/upload-artifact@v7
        with:
          name: ci-ios-web-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-ios-web.zip
          if-no-files-found: error
          retention-days: 7

  browser:
    needs: [changes, preflight]
    if: ${{ !cancelled() && needs.preflight.result == 'success' && (needs.changes.result != 'success' || needs.changes.outputs.browser == 'true') }}
    name: Browser interaction tests
    runs-on: ubuntu-24.04
    # Pin the supported browser host; retain room for cold setup and diagnostics.
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-node
        with:
          node-version: ${{ env.MITZO_CI_NODE_VERSION }}
      - name: Prefer HTTPS Ubuntu mirrors for browser dependencies
        run: |
          sudo sed -i '\|^http://azure\.archive\.ubuntu\.com/ubuntu/|d' /etc/apt/apt-mirrors.txt
          grep -Fq 'https://archive.ubuntu.com/ubuntu/' /etc/apt/apt-mirrors.txt
          grep -Fq 'https://security.ubuntu.com/ubuntu/' /etc/apt/apt-mirrors.txt
          apt-config dump Acquire::Retries Acquire::http::Timeout Acquire::https::Timeout
      - name: Install browsers and dependencies
        timeout-minutes: 8
        run: npx playwright install --with-deps webkit chromium
      - run: node scripts/ci-browser-run.mjs test:browser
        id: browser-tests
      - name: Retain browser failure evidence
        if: ${{ always() && steps.browser-tests.outcome != 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-browser-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/browser/
            playwright-report/browser/
            test-results/browser-diagnostics/
          retention-days: 7
          if-no-files-found: warn

  offline:
    needs: [changes, preflight, frontend-build]
    if: ${{ !cancelled() && needs.preflight.result == 'success' && needs['frontend-build'].result == 'success' && (needs.changes.result != 'success' || needs.changes.outputs.browser == 'true') }}
    name: Offline layouts (${{ matrix.project }} ${{ matrix.shard }}/${{ matrix.shards }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      # Bound every browser lifetime while retaining every test and its evidence.
      # Keep independent coverage and diagnostics even when another shard fails.
      fail-fast: false
      matrix:
        include:
          - project: mobile-webkit
            browser: webkit
            shard: 1
            shards: 4
          - project: mobile-webkit
            browser: webkit
            shard: 2
            shards: 4
          - project: mobile-webkit
            browser: webkit
            shard: 3
            shards: 4
          - project: mobile-webkit
            browser: webkit
            shard: 4
            shards: 4
          - project: mobile-chromium
            browser: chromium
            shard: 1
            shards: 3
          - project: mobile-chromium
            browser: chromium
            shard: 2
            shards: 3
          - project: mobile-chromium
            browser: chromium
            shard: 3
            shards: 3
          - project: desktop-chromium
            browser: chromium
            shard: 1
            shards: 3
          - project: desktop-chromium
            browser: chromium
            shard: 2
            shards: 3
          - project: desktop-chromium
            browser: chromium
            shard: 3
            shards: 3
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-node
        with:
          node-version: ${{ env.MITZO_CI_NODE_VERSION }}
      - name: Require both immutable producer artifact IDs
        env:
          CI_SERVER_ARTIFACT_ID: ${{ needs.preflight.outputs.build_artifact_id }}
          CI_FRONTEND_ARTIFACT_ID: ${{ needs['frontend-build'].outputs.build_artifact_id }}
        run: |
          [[ "$CI_SERVER_ARTIFACT_ID" =~ ^[0-9]+$ ]]
          [[ "$CI_FRONTEND_ARTIFACT_ID" =~ ^[0-9]+$ ]]
      - name: Download this candidate's compiled output
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.preflight.outputs.build_artifact_id }},${{ needs['frontend-build'].outputs.build_artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/ci-compiled
      - name: Verify and restore exact compiled prerequisites
        id: compiled-prerequisites
        run: |
          python3 scripts/ci-build-output.py restore server "$RUNNER_TEMP/ci-compiled/ci-server.zip"
          python3 scripts/ci-build-output.py restore frontend "$RUNNER_TEMP/ci-compiled/ci-frontend.zip"
      - name: Prefer HTTPS Ubuntu mirrors for browser dependencies
        run: |
          sudo sed -i '\|^http://azure\.archive\.ubuntu\.com/ubuntu/|d' /etc/apt/apt-mirrors.txt
          grep -Fq 'https://archive.ubuntu.com/ubuntu/' /etc/apt/apt-mirrors.txt
          grep -Fq 'https://security.ubuntu.com/ubuntu/' /etc/apt/apt-mirrors.txt
          apt-config dump Acquire::Retries Acquire::http::Timeout Acquire::https::Timeout
      - name: Install browsers and dependencies
        timeout-minutes: 8
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Verify shared theme and mobile layouts without a backend
        id: offline-tests
        run: node scripts/ci-browser-run.mjs test:ui:ci:prebuilt --project=${{ matrix.project }} --shard=${{ matrix.shard }}/${{ matrix.shards }}
      - name: Retain offline layout failure evidence
        if: ${{ always() && steps.offline-tests.outcome != 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-offline-failure-${{ matrix.project }}-shard-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/offline/
            playwright-report/offline/
            test-results/browser-diagnostics/
          retention-days: 7
          if-no-files-found: warn

      - name: Retain conversation library visual evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: conversation-library-visuals-${{ matrix.project }}-shard-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/offline/**/session-library-*.png
          retention-days: 7
          if-no-files-found: ignore

      - name: Retain agent tool selection visual evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: agent-tool-selection-visuals-${{ matrix.project }}-shard-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/offline/**/agent-tools-*.png
            test-results/offline/**/tool-library-*.png
          retention-days: 7
          if-no-files-found: ignore

      - name: Retain responsiveness visual acceptance screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: responsiveness-visuals-${{ matrix.project }}-shard-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/offline/**/responsiveness-*.png
            test-results/offline/**/chat-status-*.png
            test-results/offline/**/chat-queue-*.png
            test-results/offline/**/message-actions-*.png
            test-results/offline/**/native-subagents-*.png
            test-results/offline/**/agent-messages-*.png
            test-results/offline/**/timer-*.png
            test-results/offline/**/shared-composer-*.png
            test-results/offline/**/sandbox-removal-*.png
            test-results/offline/**/reusable-access-*.png
          retention-days: 7
          if-no-files-found: warn

      - name: Retain Local first-command visual evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: local-first-command-visuals-${{ matrix.project }}-shard-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/offline/**/local-*.png
            test-results/offline/**/quick-chat-settings-*.png
            test-results/offline/**/quick-sheet-*.png
            test-results/offline/**/prompt-preparation-*.png
            test-results/offline/**/composer-receipt-*.png
            test-results/offline/**/session-launch-*.png
            test-results/offline/**/session-defaults-*.png
          retention-days: 7
          if-no-files-found: ignore

      - name: Retain Telos context and setup visual evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: telos-context-and-setup-visuals-${{ matrix.project }}-shard-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/offline/**/role-*.png
            test-results/offline/**/reviewed-context-*.png
            test-results/offline/**/linked-context-*.png
            test-results/offline/**/before-joining-*.png
            test-results/offline/**/fresh-setup-*.png
            test-results/offline/**/agents-*.png
            test-results/offline/**/responders-*.png
          retention-days: 7
          if-no-files-found: ignore

      - name: Retain artefact sharing acceptance screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: artefact-sharing-acceptance-${{ matrix.project }}-shard-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/offline/**/artefact-sharing.png
            test-results/offline/**/file-options.png
          retention-days: 7
          if-no-files-found: ignore

      - name: Retain Telos saved-document navigation screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: telos-saved-navigation-visuals-${{ matrix.project }}-shard-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/offline/**/telos-outcomes-workspace*/saved-link-*.png
            test-results/offline/**/telos-outcomes-workspace*/scroll-restored-*.png
            test-results/offline/**/telos-outcomes-workspace*/output-return-*.png
            test-results/offline/**/telos-outcomes-workspace*/coordinator-labels-*.png
            test-results/offline/**/telos-outcomes-workspace*/saved-reference-return-*.png
            test-results/offline/**/telos-outcomes-workspace*/priority-handoff-*.png
          retention-days: 7
          if-no-files-found: ignore

  browser-validation:
    name: Connections browser regression
    needs: [changes, browser, offline]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Require every selected browser suite
        env:
          CI_BROWSER_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci-browser-gate.mjs

  native:
    needs: [changes, preflight, frontend-build]
    if: ${{ !cancelled() && needs.preflight.result == 'success' && needs['frontend-build'].result == 'success' && (needs.changes.result != 'success' || needs.changes.outputs.native == 'true') }}
    name: Native Swift tests and builds
    runs-on: macos-26
    # Cold boot, first launch and WebKit readiness have separate bounded waits.
    # Leave time for the build, retained diagnostics and owned-fixture cleanup.
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      # MitzoShared requires Swift 6.3; keep the toolchain explicit.
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/ci-node
        with:
          node-version: ${{ env.MITZO_CI_NODE_VERSION }}

      - uses: ./.github/actions/ci-workspace
        with:
          artifact-id: ${{ needs.preflight.outputs.workspace_artifact_id }}
      - name: Require immutable iOS web output
        env:
          CI_IOS_WEB_ARTIFACT_ID: ${{ needs['frontend-build'].outputs.ios_web_artifact_id }}
        run: '[[ "$CI_IOS_WEB_ARTIFACT_ID" =~ ^[0-9]+$ ]]'
      - name: Download generated iOS web assets
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs['frontend-build'].outputs.ios_web_artifact_id }}
          path: ${{ runner.temp }}/ci-ios-web
      - name: Restore exact iOS-mode web assets and synchronize native plugins
        run: |
          python3 scripts/ci-build-output.py restore ios-web "$RUNNER_TEMP/ci-ios-web/ci-ios-web.zip"
          cd frontend && CAPACITOR_WEB_DIR=dist-ios npx cap sync ios

      - name: Test Keychain helper with disposable credentials
        run: python3 scripts/test-keychain-helper.py

      - name: Test shared native package
        run: swift test --package-path frontend/ios/MitzoShared

      - name: Test Watch receipt routing offline
        run: python3 scripts/test-watch-chat-receipts.py

      - name: Typecheck complete Watch approval UI offline
        run: python3 scripts/test-watch-approval-ui.py

      - name: Build iPhone app with Watch companion
        if: ${{ !cancelled() }}
        run: >-
          xcodebuild -project frontend/ios/App/App.xcodeproj -scheme App
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/mitzo-ios-build"
          CODE_SIGNING_ALLOWED=NO build

      - name: Verify embedded Watch companion
        run: python3 scripts/check-watch-bundle.py "$RUNNER_TEMP/mitzo-ios-build/Build/Products/Debug-iphonesimulator/App.app"

      - name: Test real notification bridge in an offline disposable simulator
        id: native-notification
        run: >-
          python3 scripts/test-native-notification-bridge.py
          "$RUNNER_TEMP/mitzo-ios-build/Build/Products/Debug-iphonesimulator/App.app"
          --diagnostics-dir test-results/native-notification
      - name: Retain native notification failure evidence
        if: ${{ always() && steps.native-notification.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: native-notification-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/native-notification/
          retention-days: 7
          if-no-files-found: warn

  ordinary-journey:
    needs: [changes, preflight]
    if: ${{ !cancelled() && needs.preflight.result == 'success' && (needs.changes.result != 'success' || needs.changes.outputs.ordinary == 'true') }}
    name: Native repository and authorization workflows
    runs-on: macos-26
    # Native workflows and signed authority checks; joined cases have their own matrix.
    # Individual acceptance, first-response and reader deadlines stay unchanged.
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      NODE_OPTIONS: --max-old-space-size=1024
    steps:
      - uses: actions/checkout@v7
        with:
          # Native observation deliberately refuses external Git config includes.
          # Checkout credentials are unnecessary for this fully offline job.
          persist-credentials: false
      - uses: ./.github/actions/ci-node
        with:
          node-version: ${{ env.MITZO_CI_NODE_VERSION }}
      - uses: ./.github/actions/ci-workspace
        with:
          artifact-id: ${{ needs.preflight.outputs.workspace_artifact_id }}
      - uses: ./.github/actions/ci-native-fixture
      - name: Verify standalone repository proof mutation checks
        if: ${{ !cancelled() }}
        run: |
          npx vitest run server/__tests__/qualified-standalone-repository-observation.test.ts --maxWorkers=1 --reporter=default --reporter=json --outputFile=test-results/standalone-task-proofs.json
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const result = JSON.parse(readFileSync('test-results/standalone-task-proofs.json', 'utf8'));
          const suites = result.testResults;
          if (!result.success || result.numPassedTests !== 13 || result.numPendingTests !== 0 ||
              suites.length !== 1 || !suites[0].name.endsWith('/qualified-standalone-repository-observation.test.ts') ||
              suites[0].assertionResults.length !== 13 || suites[0].assertionResults.some(test => test.status !== 'passed')) {
            throw new Error('All thirteen standalone proof regressions must execute; skips are not qualification');
          }
          NODE
      - name: Verify complete native repository workflows on both owned account routes
        if: ${{ !cancelled() }}
        env:
          MITZO_RUN_NATIVE_READ_TOOLS_MECHANICAL: '1'
          MITZO_REQUIRE_NATIVE_REPOSITORY_WORKFLOW: '1'
          MITZO_NATIVE_READ_TOOLS_SOURCE_PATH: ${{ github.workspace }}
          MITZO_NATIVE_REPOSITORY_EVIDENCE_DIR: test-results/native-repository-workflows
        run: |
          node scripts/ci-native-repository-workflows.mjs
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          for(const account of ['subscription','api']) {
            const evidence=JSON.parse(readFileSync(`test-results/native-repository-workflows/${account}.json`,'utf8'));
            if(evidence.account!==account || evidence.phase!=='completed' || !evidence.coldResume || !evidence.viewerDetached ||
                evidence.outcomes.DiscoverLocalRepository?.state!=='selected' || !evidence.outcomes.InspectLocalRepository?.success ||
                evidence.outcomes.PrepareLocalRepository?.state!=='materialized' || evidence.outcomes.denied?.success!==false ||
                evidence.outcomes.revoked?.success!==false || !evidence.outcomes.custody?.scratchRemoved ||
                !evidence.outcomes.handoff?.sameConversation || !evidence.outcomes.handoff?.sameThread || !evidence.outcomes.handoff?.taskCwdSelected || !evidence.outcomes.handoff?.toolsUsable)
              throw new Error('Incomplete native repository evidence for '+account);
          }
          NODE
      - name: Retain native repository workflow diagnostics immediately
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-repository-workflows-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/standalone-task-proofs.json
            test-results/native-repository-workflows-processes/
            test-results/native-repository-workflows/
          if-no-files-found: warn
      - name: Verify signed native operator lifetime and repository tools
        if: ${{ !cancelled() }}
        env:
          MITZO_SANDBOX_INTEGRATION: '1'
          MITZO_PREPARATION_OWNER_PROFILE: '0'
        run: |
          npx vitest run server/__tests__/native-host-operator-lifetime.test.ts server/__tests__/native-local-repository-preparation-registration-dispatch.test.ts server/__tests__/native-local-repository-read-tools.test.ts server/__tests__/native-reader-path-authorization.test.ts server/__tests__/qualified-local-repository-materializer.test.ts server/__tests__/qualified-local-repository-operation-owner.test.ts --maxWorkers=1 --reporter=default --reporter=json --outputFile=test-results/native-host-authorization.json
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const result = JSON.parse(readFileSync('test-results/native-host-authorization.json', 'utf8'));
          if (!result.success) throw new Error('Signed native operator qualification failed');
          const required = [
            ['native-host-operator-lifetime.test.ts', 9],
            ['native-local-repository-preparation-registration-dispatch.test.ts', 4],
            ['native-local-repository-read-tools.test.ts', 17],
            ['native-reader-path-authorization.test.ts', 14],
            ['qualified-local-repository-materializer.test.ts', 2],
            ['qualified-local-repository-operation-owner.test.ts', 1],
          ];
          for (const [file, count] of required) {
            const suite = result.testResults.find(test => test.name.endsWith('/' + file));
            const cases = suite?.assertionResults.filter(test =>
              file !== 'native-local-repository-read-tools.test.ts' ||
              test.fullName !== 'source-mode signed Inspect positive diagnostic');
            if (cases?.length !== count || cases.some(test => test.status !== 'passed')) {
              throw new Error('Complete signed native coverage is required for ' + file);
            }
          }
          NODE
      - name: Verify signed helper worker boundaries
        if: ${{ !cancelled() }}
        env:
          MITZO_SANDBOX_INTEGRATION: '1'
        run: |
          npx vitest run server/__tests__/prepared-repository-native-read.test.ts server/__tests__/native-exclusive-file-batch.test.ts server/__tests__/native-exclusive-file.test.ts server/__tests__/prepared-repository-workspace-owner.test.ts --maxWorkers=1 -t 'reads through the actual fresh barrier|publishes six exact files|revalidates the original owner after joined worker cleanup rejects|topology helper and exactly entry/post-effect|retains original full-owner refusal at batch gate' --reporter=default --reporter=json --outputFile=test-results/native-worker-boundaries.json
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const result = JSON.parse(readFileSync('test-results/native-worker-boundaries.json', 'utf8'));
          if (!result.success) throw new Error('Signed worker boundary qualification failed');
          const required = [
            ['native-exclusive-file-batch.test.ts', 'publishes six exact files with one launch and two original full-owner checks'],
            ['native-exclusive-file-batch.test.ts', 'retains original full-owner refusal at batch gate 1 without replay'],
            ['native-exclusive-file-batch.test.ts', 'retains original full-owner refusal at batch gate 2 without replay'],
            ['native-exclusive-file.test.ts', 'revalidates the original owner after joined worker cleanup rejects, retaining uncertain published bytes'],
            ['prepared-repository-native-read.test.ts', 'reads through the actual fresh barrier and same existing SRT helper with no source write root'],
            ['prepared-repository-workspace-owner.test.ts', 'owns one linked topology helper and exactly entry/post-effect credential checks'],
            ['prepared-repository-workspace-owner.test.ts', 'owns one standalone topology helper and exactly entry/post-effect credential checks'],
          ];
          for (const [file, fullName] of required) {
            const suite = result.testResults.find(test => test.name.endsWith('/' + file));
            const cases = suite?.assertionResults.filter(test => test.fullName === fullName);
            if (cases?.length !== 1 || cases[0].status !== 'passed') {
              throw new Error('Required signed worker boundary missing or nonpassing: ' + fullName);
            }
          }
          NODE
      - name: Retain exact offline journey result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: telos-ordinary-journey-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/native-host-authorization.json
            test-results/native-worker-boundaries.json
            test-results/qualified-preparation-actor.json
            test-results/native-repository-workflows-processes/
            test-results/native-repository-workflows/
          if-no-files-found: error

  ordinary-joined:
    needs: [changes, preflight]
    if: ${{ !cancelled() && needs.preflight.result == 'success' && (needs.changes.result != 'success' || needs.changes.outputs.ordinary == 'true') }}
    name: Telos joined acceptance (macOS ${{ matrix.shard }}/3)
    runs-on: macos-26
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      NODE_OPTIONS: --max-old-space-size=1024
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-node
        with:
          node-version: ${{ env.MITZO_CI_NODE_VERSION }}
      - uses: ./.github/actions/ci-workspace
        with:
          artifact-id: ${{ needs.preflight.outputs.workspace_artifact_id }}
      - uses: ./.github/actions/ci-native-fixture
      - uses: ./.github/actions/ci-canonical-browser
      - name: Run every case in the required joined shard
        run: node tests/integration/telos-s9/integrated-candidate/run-joined-ci.mjs --shard=${{ matrix.shard }}/3
      - name: Retain exact joined acceptance results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: telos-joined-${{ matrix.shard }}-of-3-${{ github.run_id }}
          overwrite: true
          path: test-results/telos-s9-joined/
          if-no-files-found: error

  joined-validation:
    name: Complete joined acceptance coverage
    needs: [changes, ordinary-joined]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.MITZO_CI_NODE_VERSION }}
      - name: Collect every joined shard from this workflow run
        if: ${{ needs.ordinary-joined.result == 'success' }}
        uses: actions/download-artifact@v8
        with:
          pattern: telos-joined-*-of-3-${{ github.run_id }}
          path: joined-results
          merge-multiple: true
      - name: Require all twelve groups and fourteen actual App cases
        if: always()
        env:
          CI_JOINED_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci-joined-gate.mjs joined-results

  ordinary-supplemental:
    needs: [changes, preflight]
    if: ${{ !cancelled() && needs.preflight.result == 'success' && (needs.changes.result != 'success' || needs.changes.outputs.ordinary == 'true') }}
    name: Telos supplemental owner journeys (Linux ${{ matrix.shard }}/2)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      NODE_OPTIONS: --max-old-space-size=1024
      S9_SUPPLEMENTAL_PORTABLE_CLI: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-node
        with:
          node-version: ${{ env.MITZO_CI_NODE_VERSION }}
      - uses: ./.github/actions/ci-workspace
        with:
          artifact-id: ${{ needs.preflight.outputs.workspace_artifact_id }}
      - uses: ./.github/actions/ci-canonical-browser
      - name: Run the required closed supplemental shard
        run: node tests/integration/telos-s9/integrated-candidate/run-supplemental-ci.mjs --shard=${{ matrix.shard }}/2
      - name: Retain exact supplemental owner results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: telos-supplemental-${{ matrix.shard }}-of-2-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/telos-s9-supplemental/
          if-no-files-found: error

  core:
    name: Core checks
    needs: [preflight, frontend-build]
    if: ${{ !cancelled() && needs.preflight.result == 'success' && needs['frontend-build'].result == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/ci-node
        with:
          node-version: ${{ env.MITZO_CI_NODE_VERSION }}

      - name: Verify native knowledge write boundary
        run: |
          gcc -O2 -Wall -Wextra -Werror docs/spikes/openshell-codex/knowledge-write-scope.c -o "$RUNNER_TEMP/knowledge-write-scope"
          sudo install -d /usr/libexec/mitzo
          sudo install -m 0755 "$RUNNER_TEMP/knowledge-write-scope" /usr/libexec/mitzo/knowledge-write-scope
          sudo install -d -o "$USER" /sandbox
          python3 -I docs/spikes/openshell-codex/knowledge-write-scope-smoke.py

      - name: Require both immutable producer artifact IDs
        env:
          CI_SERVER_ARTIFACT_ID: ${{ needs.preflight.outputs.build_artifact_id }}
          CI_FRONTEND_ARTIFACT_ID: ${{ needs['frontend-build'].outputs.build_artifact_id }}
        run: |
          [[ "$CI_SERVER_ARTIFACT_ID" =~ ^[0-9]+$ ]]
          [[ "$CI_FRONTEND_ARTIFACT_ID" =~ ^[0-9]+$ ]]
      - name: Download this candidate's compiled output
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.preflight.outputs.build_artifact_id }},${{ needs['frontend-build'].outputs.build_artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/ci-compiled
      - name: Verify and restore exact compiled prerequisites
        id: compiled-prerequisites
        run: |
          python3 scripts/ci-build-output.py restore server "$RUNNER_TEMP/ci-compiled/ci-server.zip"
          python3 scripts/ci-build-output.py restore frontend "$RUNNER_TEMP/ci-compiled/ci-frontend.zip"

      - name: Verify pinned Codex resume without inference
        id: codex-resume
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(cat docs/spikes/openshell-codex/runtime-codex-version)
          RUNTIME_DIR="$RUNNER_TEMP/codex-resume-contract"
          mkdir -p "$RUNTIME_DIR"
          gh release download "rust-v$VERSION" --repo openai/codex \
            --pattern codex-x86_64-unknown-linux-musl.tar.gz --dir "$RUNTIME_DIR"
          tar -xzf "$RUNTIME_DIR/codex-x86_64-unknown-linux-musl.tar.gz" -C "$RUNTIME_DIR"
          python3 scripts/test-codex-metadata-resume.py \
            --codex "$RUNTIME_DIR/codex-x86_64-unknown-linux-musl"

      - name: Verify reviewed daily quote catalogue
        id: quotes
        if: ${{ !cancelled() }}
        run: npm run quotes:check

      - name: Lint
        id: lint
        if: ${{ !cancelled() }}
        run: npm run lint

      - name: Format check
        id: format
        if: ${{ !cancelled() }}
        run: npm run format:check

      # Continue independent checks after failure, but release superseded runs.
      - name: Design token contract
        id: design
        if: ${{ !cancelled() }}
        run: npm run test:design

      - name: Audit
        id: audit
        if: ${{ !cancelled() }}
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Secret scan
        id: secret-scan
        if: ${{ !cancelled() }}
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build MCP server
        id: build-mcp
        if: ${{ !cancelled() }}
        run: cd mcp-server && npm ci && npm run build

      - name: Bundle size
        id: bundle-size
        if: ${{ !cancelled() }}
        run: |
          JS_SIZE=$(wc -c < frontend/dist/assets/index-*.js 2>/dev/null || echo 0)
          CSS_SIZE=$(wc -c < frontend/dist/assets/index-*.css 2>/dev/null || echo 0)
          JS_KB=$((JS_SIZE / 1024))
          CSS_KB=$((CSS_SIZE / 1024))
          echo "JS: ${JS_KB}KB, CSS: ${CSS_KB}KB"
          echo "### Bundle Size" >> $GITHUB_STEP_SUMMARY
          echo "| Asset | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| JS | ${JS_KB}KB |" >> $GITHUB_STEP_SUMMARY
          echo "| CSS | ${CSS_KB}KB |" >> $GITHUB_STEP_SUMMARY
          if [ "$JS_KB" -gt 600 ]; then
            echo "::warning::JS bundle exceeds 600KB (${JS_KB}KB)"
          fi

      - name: Summary
        if: always()
        run: |
          if [ "${{ steps.codex-resume.outcome }}" = "failure" ] || \
             [ "${{ steps.lint.outcome }}" = "failure" ] || \
             [ "${{ steps.quotes.outcome }}" = "failure" ] || \
             [ "${{ steps.format.outcome }}" = "failure" ] || \
             [ "${{ steps.design.outcome }}" = "failure" ] || \
             [ "${{ steps.secret-scan.outcome }}" = "failure" ] || \
             [ "${{ steps.build-mcp.outcome }}" = "failure" ] || \
             [ "${{ steps.compiled-prerequisites.outcome }}" = "failure" ]; then
            echo "One or more CI steps failed."
            exit 1
          fi

  prepared-consumers:
    strategy:
      fail-fast: false
      matrix:
        group: [delivery, publication]
    name: Composed prepared repository consumers (Linux ${{ matrix.group }})
    needs: [changes, preflight]
    if: ${{ !cancelled() && needs.preflight.result == 'success' && (needs.changes.result != 'success' || needs.changes.outputs.prepared == 'true') }}
    runs-on: ubuntu-24.04
    # Measured composed journeys plus setup; individual 15-minute cases stay intact.
    # Hosted contention still fails closed at this finite lane boundary.
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      NODE_OPTIONS: --max-old-space-size=1024
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-node
        with:
          node-version: ${{ env.MITZO_CI_NODE_VERSION }}
      - uses: ./.github/actions/ci-workspace
        with:
          artifact-id: ${{ needs.preflight.outputs.workspace_artifact_id }}
      - name: Run all seven offline delivery and publication cases in isolated processes
        run: node scripts/ci-prepared-consumers.mjs ${{ matrix.group }}
      - name: Retain exact consumer reports, exits and resource evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: prepared-consumers-${{ matrix.group }}-${{ github.run_id }}
          overwrite: true
          path: test-results/prepared-consumers/
          retention-days: 7
          if-no-files-found: error

  prepared-consumer-validation:
    name: Complete prepared consumer coverage
    needs: [changes, prepared-consumers]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.MITZO_CI_NODE_VERSION }}
      - name: Collect both prepared consumer groups from this workflow run
        if: ${{ needs.prepared-consumers.result == 'success' }}
        uses: actions/download-artifact@v8
        with:
          pattern: prepared-consumers-*-${{ github.run_id }}
          path: prepared-consumer-results
          merge-multiple: true
      - name: Require every selected prepared consumer case
        if: always()
        env:
          CI_PREPARED_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci-prepared-consumer-gate.mjs prepared-consumer-results

  unit:
    needs: [preflight, frontend-build]
    if: ${{ !cancelled() && needs.preflight.result == 'success' && needs['frontend-build'].result == 'success' }}
    name: Unit tests (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    env:
      MITZO_CI_PREPARED_CONSUMERS: '1'
    strategy:
      # Finish every shard to retain complete coverage and failure evidence.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/ci-node
        with:
          node-version: ${{ env.MITZO_CI_NODE_VERSION }}
      - name: Require both immutable producer artifact IDs
        env:
          CI_SERVER_ARTIFACT_ID: ${{ needs.preflight.outputs.build_artifact_id }}
          CI_FRONTEND_ARTIFACT_ID: ${{ needs['frontend-build'].outputs.build_artifact_id }}
        run: |
          [[ "$CI_SERVER_ARTIFACT_ID" =~ ^[0-9]+$ ]]
          [[ "$CI_FRONTEND_ARTIFACT_ID" =~ ^[0-9]+$ ]]
      - name: Download this candidate's compiled output
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.preflight.outputs.build_artifact_id }},${{ needs['frontend-build'].outputs.build_artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/ci-compiled
      - name: Verify and restore exact compiled prerequisites
        id: compiled-prerequisites
        run: |
          python3 scripts/ci-build-output.py restore server "$RUNNER_TEMP/ci-compiled/ci-server.zip"
          python3 scripts/ci-build-output.py restore frontend "$RUNNER_TEMP/ci-compiled/ci-frontend.zip"
      - name: Discover the complete unit test suite without executing tests
        run: |
          mkdir -p unit-results
          npx vitest list --filesOnly --json=unit-results/files-${{ matrix.shard }}.json
      - name: Test
        id: test
        if: ${{ !cancelled() && steps['compiled-prerequisites'].outcome == 'success' }}
        run: >-
          npm test -- --shard=${{ matrix.shard }}/4
          --reporter=default --reporter=json
          --outputFile=unit-results/report-${{ matrix.shard }}.json
      - name: Retain unit shard evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          # Re-running a failed job replaces only that shard in this run.
          name: unit-tests-${{ matrix.shard }}-${{ github.sha }}
          path: unit-results/
          overwrite: true
          retention-days: 7
          if-no-files-found: error

  unit-validation:
    needs: [core, unit]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.MITZO_CI_NODE_VERSION }}
      - name: Collect every unit shard from this workflow run
        if: ${{ needs.unit.result == 'success' }}
        uses: actions/download-artifact@v8
        with:
          pattern: unit-tests-*-${{ github.sha }}
          path: unit-results
          merge-multiple: true
      - name: Require static checks and complete unit coverage
        if: always()
        env:
          CI_CORE_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci-unit-gate.mjs unit-results

  ci:
    name: ci
    needs:
      [
        changes,
        preflight,
        frontend-build,
        core,
        ordinary-journey,
        joined-validation,
        ordinary-supplemental,
        browser-validation,
        native,
        unit-validation,
        prepared-consumer-validation,
      ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Require every selected CI owner
        env:
          CI_REQUIRED_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci-required-gate.mjs
