name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Lint
        id: lint
        run: npm run lint

      - name: Format check
        id: format
        run: npm run format:check

      - name: Type check (server)
        id: typecheck-server
        if: always()
        run: npx tsc --noEmit

      - name: Type check (frontend)
        id: typecheck-frontend
        if: always()
        run: cd frontend && npx tsc -b

      - name: Test
        id: test
        if: always()
        run: npm test

      - name: Test count guard
        id: test-count
        if: always()
        run: |
          COUNT=$(npx vitest run 2>&1 | grep -oP '(\d+) passed' | head -1 | grep -oP '\d+')
          echo "Test count: $COUNT"
          if [ "$COUNT" -lt 200 ]; then
            echo "::error::Test count dropped below 200 (got $COUNT). Did you accidentally delete tests?"
            exit 1
          fi

      - name: Build
        id: build
        if: always()
        run: npm run build

      - name: Bundle size
        id: bundle-size
        if: always()
        run: |
          JS_SIZE=$(stat -c%s frontend/dist/assets/index-*.js 2>/dev/null || echo 0)
          CSS_SIZE=$(stat -c%s frontend/dist/assets/index-*.css 2>/dev/null || echo 0)
          JS_KB=$((JS_SIZE / 1024))
          CSS_KB=$((CSS_SIZE / 1024))
          echo "JS: ${JS_KB}KB, CSS: ${CSS_KB}KB"
          echo "### Bundle Size" >> $GITHUB_STEP_SUMMARY
          echo "| Asset | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| JS | ${JS_KB}KB |" >> $GITHUB_STEP_SUMMARY
          echo "| CSS | ${CSS_KB}KB |" >> $GITHUB_STEP_SUMMARY
          if [ "$JS_KB" -gt 600 ]; then
            echo "::warning::JS bundle exceeds 600KB (${JS_KB}KB)"
          fi

      - name: Summary
        if: always()
        run: |
          if [ "${{ steps.lint.outcome }}" = "failure" ] || \
             [ "${{ steps.format.outcome }}" = "failure" ] || \
             [ "${{ steps.typecheck-server.outcome }}" = "failure" ] || \
             [ "${{ steps.typecheck-frontend.outcome }}" = "failure" ] || \
             [ "${{ steps.test.outcome }}" = "failure" ] || \
             [ "${{ steps.test-count.outcome }}" = "failure" ] || \
             [ "${{ steps.build.outcome }}" = "failure" ]; then
            echo "One or more CI steps failed."
            exit 1
          fi
