name: PR landing reconciliation

on:
  workflow_run:
    workflows: [PR landing request, CI, Centaur merge gate]
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'

permissions:
  contents: read

concurrency:
  group: pr-landing-reconciliation
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    # Provision separately: default-branch-only environment and dedicated landing
    # App. Administration:read is needed to verify strict, App-bound protection.
    environment: pr-landing-writer
    steps:
      # workflow_run uses the default branch; never check out its triggering SHA.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/create-github-app-token@v2
        id: landing-token
        with:
          app-id: ${{ vars.PR_LANDING_APP_ID }}
          private-key: ${{ secrets.PR_LANDING_APP_PRIVATE_KEY }}
          permission-statuses: read
          permission-issues: read
          permission-checks: read
          permission-actions: read
          permission-administration: read
          permission-contents: write
          permission-pull-requests: read
      - uses: actions/github-script@v9
        env:
          CENTAUR_STATUS_APP_ID: ${{ vars.CENTAUR_STATUS_APP_ID }}
          CENTAUR_STATUS_APP_LOGIN: ${{ vars.CENTAUR_STATUS_APP_LOGIN }}
          CENTAUR_REVIEWER_LOGIN: ${{ vars.CENTAUR_REVIEWER_LOGIN || github.repository_owner }}
        with:
          github-token: ${{ steps.landing-token.outputs.token }}
          script: |
            const {reconcile} = await import(require('node:url').pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/pr-landing.mjs`).href);
            const decisions = await reconcile(github, {...context.repo,
              appId: Number(process.env.CENTAUR_STATUS_APP_ID),
              appLogin: process.env.CENTAUR_STATUS_APP_LOGIN,
              reviewer: process.env.CENTAUR_REVIEWER_LOGIN});
            core.info(JSON.stringify(decisions));
            await core.summary.addCodeBlock(JSON.stringify(decisions, null, 2), 'json').write();
