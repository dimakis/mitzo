name: Documentation

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: documentation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  documentation:
    name: Documentation gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7

      - name: Require README review for production changes
        uses: actions/github-script@v9
        with:
          script: |
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              per_page: 100,
            });

            const { evaluateDocumentationGate } = await import(
              '${{ github.workspace }}/scripts/documentation-gate.mjs'
            );
            const result = evaluateDocumentationGate({
              files,
              body: context.payload.pull_request.body || '',
            });

            if (!result.ok) {
              core.setFailed(result.errors.join('\n'));
            }
