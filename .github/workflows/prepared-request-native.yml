name: Prepared request native source

on:
  pull_request:
    paths:
      - 'docs/spikes/openshell-codex/prepared-request-native/**'
      - '.github/workflows/prepared-request-native.yml'
  push:
    branches: [main]
    paths:
      - 'docs/spikes/openshell-codex/prepared-request-native/**'
      - '.github/workflows/prepared-request-native.yml'

permissions:
  contents: read

concurrency:
  group: prepared-request-native-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  source:
    name: Native offline fixtures (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Cold setup/builds need room for the complete offline fixture suite.
    # Source89 run39463080370 hit120min on bothOS during the complete suite.
    # Retain full coverage, one test thread and zero retries; allow completion.
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26]
    env:
      CARGO_BUILD_JOBS: 1
      # Keep the broader Core fixture build within hosted-runner disk limits.
      # This changes debug information only; test/debug assertions remain enabled.
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      NODE_OPTIONS: --max-old-space-size=1024
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/checkout@v7
        with:
          repository: openai/codex
          ref: a956835d020762cb2b570053af06f643a11c0ecc
          path: .native-prepared-source
          persist-credentials: false
      - name: Reconstruct and verify pinned public source
        run: |
          node docs/spikes/openshell-codex/prepared-request-native/qualify-source.mjs "$PWD/.native-prepared-source"
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          import { resolve } from 'node:path';
          const base = 'docs/spikes/openshell-codex/prepared-request-native';
          const proof = JSON.parse(readFileSync(`${base}/source-evidence.json`, 'utf8'));
          for (const patch of proof.patches) {
            execFileSync('git', ['apply', '--index', resolve(base, patch.file)], { cwd: '.native-prepared-source', stdio: 'inherit' });
          }
          const tree = execFileSync('git', ['write-tree'], { cwd: '.native-prepared-source', encoding: 'utf8' }).trim();
          if (tree !== proof.sourceTree) throw new Error('Tested native source tree mismatch');
          execFileSync('git', ['diff', '--exit-code'], { cwd: '.native-prepared-source', stdio: 'inherit' });
          JS
      - name: Install pinned source test tools
        working-directory: .native-prepared-source
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component clippy,rustfmt
          cargo +1.95.0 install --locked just --version 1.59.0
          cargo +1.95.0 install --locked cargo-nextest --version 0.9.148
      # Same immutable tool action as the pinned upstream setup-ci contract.
      - uses: facebook/install-dotslash@1e4e7b3e07eaca387acb98f1d4720e0bee8dbb6a
      - name: Make DotSlash available to native subprocess fixtures
        shell: bash
        run: |
          set -euo pipefail
          native_dotslash="$(command -v dotslash)"
          if [[ ! "$native_dotslash" -ef /usr/local/bin/dotslash ]]; then
            if [[ -w /usr/local/bin ]]; then
              cp "$native_dotslash" /usr/local/bin
            else
              sudo cp "$native_dotslash" /usr/local/bin
            fi
          fi
      - name: Prepare Linux native test prerequisites
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends build-essential pkg-config libcap-dev libasound2-dev bubblewrap
          # Enable the namespaces used by the actual upstream sandbox tests.
          sudo sysctl -w kernel.unprivileged_userns_clone=1
          if sudo sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Fetch locked public dependencies
        working-directory: .native-prepared-source/codex-rs
        run: cargo fetch --locked
      - name: Check pinned V8 artifact dependency owner offline
        shell: bash
        working-directory: .native-prepared-source
        run: |
          set -euo pipefail
          CODEX_REPO_ROOT="$PWD" python3 - <<'PY'
          import os, sys, unittest
          from pathlib import Path
          sys.path.insert(0, str(Path(os.environ['CODEX_REPO_ROOT']) / 'scripts'))
          suite = unittest.defaultTestLoader.loadTestsFromName('codex_package.test_v8')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if not result.wasSuccessful():
              raise SystemExit(1)
          PY
      - name: Prepare verified Codex V8 artifacts
        shell: bash
        working-directory: .native-prepared-source
        run: |
          set -euo pipefail
          CODEX_REPO_ROOT="$PWD" python3 - <<'PY'
          import hashlib, json, os, subprocess, sys
          from pathlib import Path
          source_root = Path(os.environ['CODEX_REPO_ROOT'])
          sys.path.insert(0, str(source_root / 'scripts'))
          from codex_package.targets import TARGET_SPECS
          from codex_package.v8 import fetch_codex_v8_artifacts, resolved_v8_crate_version
          compiler = subprocess.check_output(['rustc', '+1.95.0', '-vV'], text=True)
          hosts = [line.removeprefix('host: ') for line in compiler.splitlines() if line.startswith('host: ')]
          if len(hosts) != 1 or hosts[0] not in {'aarch64-apple-darwin', 'x86_64-unknown-linux-gnu'}:
              raise RuntimeError(f'Unsupported native CI host: {hosts}')
          if os.environ.get('V8_FROM_SOURCE', '').lower() in {'1', 'true', 'yes'}:
              raise RuntimeError('V8 source-build override is unsupported in verified artifact CI')
          host = hosts[0]
          # This pinned owner verifies the source-pinned manifest, then BOTH files.
          # Its convenience environment resolver permits overrides; use verified fetch directly.
          pair = fetch_codex_v8_artifacts(
              TARGET_SPECS[host],
              cache_root=Path(os.environ['RUNNER_TEMP']) / 'native-rusty-v8',
          )
          def digest(path):
              with path.open('rb') as source:
                  return hashlib.file_digest(source, 'sha256').hexdigest()
          proof = {
              'host': host,
              'v8_crate_version': resolved_v8_crate_version(),
              'archive': str(pair.archive),
              'archive_sha256': digest(pair.archive),
              'binding': str(pair.binding),
              'binding_sha256': digest(pair.binding),
          }
          (source_root / 'native-v8-artifacts.json').write_text(json.dumps(proof, indent=2) + '\n')
          with Path(os.environ['GITHUB_ENV']).open('a') as environment:
              environment.write(f'RUSTY_V8_ARCHIVE={pair.archive}\nRUSTY_V8_SRC_BINDING_PATH={pair.binding}\n')
          print(json.dumps(proof))
          PY
      - name: Build standalone native test helpers
        id: native_helpers
        shell: bash
        working-directory: .native-prepared-source/codex-rs
        env:
          CARGO_NET_OFFLINE: 'true'
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="$PWD/target"
          cargo build --locked --offline -p codex-cli --bin codex \
            -p codex-rmcp-client --bin test_stdio_server --bin test_streamable_http_server \
            -p codex-code-mode-host --bin codex-code-mode-host \
            -p codex-shell-escalation --bin codex-execve-wrapper
          for native_helper in codex test_stdio_server test_streamable_http_server codex-code-mode-host codex-execve-wrapper; do
            test -x "$CARGO_TARGET_DIR/debug/$native_helper"
          done
          {
            echo "CARGO_TARGET_DIR=$CARGO_TARGET_DIR"
            echo "CARGO_BIN_EXE_codex=$CARGO_TARGET_DIR/debug/codex"
            echo "CARGO_BIN_EXE_test_stdio_server=$CARGO_TARGET_DIR/debug/test_stdio_server"
            echo "CARGO_BIN_EXE_test_streamable_http_server=$CARGO_TARGET_DIR/debug/test_streamable_http_server"
            echo "CARGO_BIN_EXE_codex-code-mode-host=$CARGO_TARGET_DIR/debug/codex-code-mode-host"
            echo "CARGO_BIN_EXE_codex_code_mode_host=$CARGO_TARGET_DIR/debug/codex-code-mode-host"
            echo "CARGO_BIN_EXE_codex-execve-wrapper=$CARGO_TARGET_DIR/debug/codex-execve-wrapper"
            echo "CARGO_BIN_EXE_codex_execve_wrapper=$CARGO_TARGET_DIR/debug/codex-execve-wrapper"
          } >> "$GITHUB_ENV"
          if [[ "$RUNNER_OS" == 'Linux' ]]; then
            cargo build --locked --offline -p codex-linux-sandbox --bin codex-linux-sandbox
            test -x "$CARGO_TARGET_DIR/debug/codex-linux-sandbox"
            {
              echo "CARGO_BIN_EXE_codex-linux-sandbox=$CARGO_TARGET_DIR/debug/codex-linux-sandbox"
              echo "CARGO_BIN_EXE_codex_linux_sandbox=$CARGO_TARGET_DIR/debug/codex-linux-sandbox"
            } >> "$GITHUB_ENV"
          fi
      - name: Discover and run required Core regression fixtures first
        id: original_regression_oracles
        if: ${{ !cancelled() && steps.native_helpers.outcome == 'success' }}
        shell: bash
        working-directory: .native-prepared-source/codex-rs
        env:
          CARGO_NET_OFFLINE: 'true'
        run: |
          set -euo pipefail
          # Early diagnostic ordering only; the complete original suite still runs.
          native_oracle_filter='test(=client::public_responses_capture::tests::bundled_luna_row_retains_its_real_encoding_flag_and_full_model_during_public_capture) | test(=client::public_responses_capture::tests::public_route_encodes_one_standard_body_without_replacing_the_lite_catalog_row) | test(=thread_manager::pre_session_skills::tests::original_thread_manager_captures_hidden_knowledge_and_native_model_without_startup) | test(=session::client_input_data::tests::retained_tool_carrier_burns_foreign_allocation_and_repeated_install_or_take) | test(=session::client_input_data::tests::retained_tool_binding_ignores_unbound_contexts_and_never_recovers_after_cancel_or_failure) | test(=session::turn_input::tests::retained_tools_bind_only_actual_admitted_user_and_reject_automatic_or_recovery) | test(=tools::spec_plan::tests::retained_actual_registry_iterator_associates_before_router_and_preserves_final_specs) | test(=tools::spec_plan::tests::retained_router_metadata_mismatch_burns_before_adapter_and_cannot_fall_back) | test(=session::configured_settings_data::tests::configured_baseline_preserves_actual_history_owner_and_explicit_empty_precedence) | test(=session::configured_settings_data::tests::configured_baseline_uses_real_context_fallback_but_never_foreign_settings_owner) | test(=session::configured_settings_data::tests::configured_step_preserves_original_luna_tier_filter_and_full_settings_data) | test(=session::configured_settings_data::tests::configured_permission_environment_stages_keep_original_values_and_unresolved_states) | test(=session::startup_selection::tests::original_startup_retains_effective_baseline_and_rejects_changed_selected_inputs) | test(=session::configured_settings_data::tests::retained_configured_baseline_keeps_owned_data_and_burns_each_stage) | test(=session::configured_settings_data::tests::retained_configured_baseline_refuses_changed_presence_order_history_source_and_fork) | test(=session::configured_settings_update::tests::providerless_update_preserves_whole_mutable_data_and_sparse_precedence) | test(=session::configured_settings_update::tests::providerless_environment_guard_and_permission_errors_precede_step_edits) | test(=session::configured_settings_update::tests::providerless_permission_environment_and_roots_are_resolved_before_final_step) | test(=session::startup_selection::selected_settings_candidate::tests::selected_candidate_uses_retained_baseline_and_sparse_tier_precedence) | test(=session::startup_selection::selected_settings_candidate::tests::selected_candidate_refuses_foreign_effective_owner_and_changed_baseline) | test(=session::startup_selection::selected_settings_candidate::tests::selected_candidate_checks_proposed_permissions_before_step_constraints) | test(=session::client_input_data::fresh_history_data::tests::actual_selected_packet_moves_same_window_and_history_into_original_stages_once) | test(=session::client_input_data::fresh_history_data::tests::foreign_changed_source_history_and_equal_config_owner_burn_selected_slot) | test(=session::client_input_data::fresh_history_data::tests::wrong_stage_missing_values_and_non_new_capture_never_reconstruct_history) | test(=session::turn_input_submission::tests::whole_request_all_modes_and_trace_move_once_into_original_core_submission) | test(=session::turn_input_submission::tests::original_oneshot_preserves_routing_decisions_and_error_payloads) | test(=session::turn_input_submission::tests::dropping_same_original_submission_closes_waiter_and_waiter_loss_does_not_replay) | test(=session::turn_input_submission::tests::same_opaque_command_and_complete_request_cross_actual_core_channel_once) | test(=session::turn_input_submission::tests::protocol_wrapping_preserves_controls_recovery_and_legacy_turn_input) | test(=session::turn_input_submission::tests::dropping_queued_typed_command_closes_original_waiter_without_replay) | test(=session::startup_selection::selected_settings_candidate::tests::paired_command_uses_native_normalized_settings_and_same_prepared_data_once) | test(=session::startup_selection::selected_settings_candidate::tests::paired_first_step_uses_changed_personality_and_exact_effective_overrides_once) | test(=session::startup_selection::selected_settings_candidate::tests::first_step_refuses_missing_foreign_changed_model_settings_and_catalog_publication) | test(=session::first_step_model_data::tests::original_first_step_preserves_resolved_row_and_late_summary_tier_filtering) | test(=session::first_step_model_data::tests::ordinary_first_step_resolves_changed_model_instead_of_reusing_startup_row) | test(=session::startup_selection::tests::retained_startup_config_heap_storage_preserves_values_and_original_adoption) | test(=session::model_client_construction::tests::retained_client_heap_snapshot_keeps_same_client_and_ordinary_optional_layout) | test(=session::initial_model_state_data::tests::original_previous_model_precedence_and_native_fragment_match_actual_model_data) | test(=session::client_input_data::fresh_history_data::tests::actual_fresh_capsule_moves_distinct_constructor_and_post_event_reset_once) | test(=session::client_input_data::fresh_history_data::tests::original_fresh_previous_stages_refuse_foreign_config_source_history_or_wrong_order) | test(=session::base_instructions_data::tests::original_provenance_branches_preserve_config_history_precedence_and_prompt_copy) | test(=session::base_instructions_data::tests::captured_base_values_move_once_and_refuse_foreign_changed_or_nonfresh_inputs) | test(=session::startup_selection::tests::retained_base_stays_startup_owned_across_first_command_personality_and_original_packet_adoption) | test(=session::turn_user_input_data::tests::original_internal_projection_keeps_order_and_ignores_all_non_user_partitions) | test(=session::turn_user_input_data::tests::original_start_classification_rejects_reply_ids_other_items_and_mail_without_mutation) | test(=session::startup_selection::selected_settings_candidate::tests::first_step_context_uses_same_command_model_and_refuses_lossy_reply_or_root_substitution) | test(=session::startup_selection::selected_settings_candidate::tests::permission_context_refuses_foreign_changed_burned_and_keeps_unpaired_baseline) | test(=session::startup_selection::selected_settings_candidate::tests::standalone_skills_projection_retains_same_complete_box_and_original_model_owner) | test(=thread_manager::pre_session_skills::tests::shared_skills_body_retains_exact_model_arc_and_legacy_prompt_data) | test(=session::configured_settings_data::tests::candidate_permission_section_uses_actual_proposed_profile_step_and_original_renderer) | test(=environment_selection::initial_context::tests::original_local_roots_materialize_proposed_profile_and_refuse_changed_selection_or_cwd)'
          env -u CODEX_TEST_REALTIME_TLS_ADDRESS -u CODEX_TEST_REALTIME_TLS_TRUST \
            NEXTEST_PROFILE=local RUST_MIN_STACK=8388608 \
            cargo nextest list --lib -p codex-core -E "$native_oracle_filter" \
            --message-format json > native-core-regression-list.json
          python3 - <<'PY_ORACLES'
          import json
          from pathlib import Path
          expected = {'client::public_responses_capture::tests::bundled_luna_row_retains_its_real_encoding_flag_and_full_model_during_public_capture', 'client::public_responses_capture::tests::public_route_encodes_one_standard_body_without_replacing_the_lite_catalog_row', 'environment_selection::initial_context::tests::original_local_roots_materialize_proposed_profile_and_refuse_changed_selection_or_cwd', 'session::base_instructions_data::tests::captured_base_values_move_once_and_refuse_foreign_changed_or_nonfresh_inputs', 'session::base_instructions_data::tests::original_provenance_branches_preserve_config_history_precedence_and_prompt_copy', 'session::client_input_data::fresh_history_data::tests::actual_fresh_capsule_moves_distinct_constructor_and_post_event_reset_once', 'session::client_input_data::fresh_history_data::tests::actual_selected_packet_moves_same_window_and_history_into_original_stages_once', 'session::client_input_data::fresh_history_data::tests::foreign_changed_source_history_and_equal_config_owner_burn_selected_slot', 'session::client_input_data::fresh_history_data::tests::original_fresh_previous_stages_refuse_foreign_config_source_history_or_wrong_order', 'session::client_input_data::fresh_history_data::tests::wrong_stage_missing_values_and_non_new_capture_never_reconstruct_history', 'session::client_input_data::tests::retained_tool_binding_ignores_unbound_contexts_and_never_recovers_after_cancel_or_failure', 'session::client_input_data::tests::retained_tool_carrier_burns_foreign_allocation_and_repeated_install_or_take', 'session::configured_settings_data::tests::candidate_permission_section_uses_actual_proposed_profile_step_and_original_renderer', 'session::configured_settings_data::tests::configured_baseline_preserves_actual_history_owner_and_explicit_empty_precedence', 'session::configured_settings_data::tests::configured_baseline_uses_real_context_fallback_but_never_foreign_settings_owner', 'session::configured_settings_data::tests::configured_permission_environment_stages_keep_original_values_and_unresolved_states', 'session::configured_settings_data::tests::configured_step_preserves_original_luna_tier_filter_and_full_settings_data', 'session::configured_settings_data::tests::retained_configured_baseline_keeps_owned_data_and_burns_each_stage', 'session::configured_settings_data::tests::retained_configured_baseline_refuses_changed_presence_order_history_source_and_fork', 'session::configured_settings_update::tests::providerless_environment_guard_and_permission_errors_precede_step_edits', 'session::configured_settings_update::tests::providerless_permission_environment_and_roots_are_resolved_before_final_step', 'session::configured_settings_update::tests::providerless_update_preserves_whole_mutable_data_and_sparse_precedence', 'session::first_step_model_data::tests::ordinary_first_step_resolves_changed_model_instead_of_reusing_startup_row', 'session::first_step_model_data::tests::original_first_step_preserves_resolved_row_and_late_summary_tier_filtering', 'session::initial_model_state_data::tests::original_previous_model_precedence_and_native_fragment_match_actual_model_data', 'session::model_client_construction::tests::retained_client_heap_snapshot_keeps_same_client_and_ordinary_optional_layout', 'session::startup_selection::selected_settings_candidate::tests::first_step_context_uses_same_command_model_and_refuses_lossy_reply_or_root_substitution', 'session::startup_selection::selected_settings_candidate::tests::first_step_refuses_missing_foreign_changed_model_settings_and_catalog_publication', 'session::startup_selection::selected_settings_candidate::tests::paired_command_uses_native_normalized_settings_and_same_prepared_data_once', 'session::startup_selection::selected_settings_candidate::tests::paired_first_step_uses_changed_personality_and_exact_effective_overrides_once', 'session::startup_selection::selected_settings_candidate::tests::permission_context_refuses_foreign_changed_burned_and_keeps_unpaired_baseline', 'session::startup_selection::selected_settings_candidate::tests::selected_candidate_checks_proposed_permissions_before_step_constraints', 'session::startup_selection::selected_settings_candidate::tests::selected_candidate_refuses_foreign_effective_owner_and_changed_baseline', 'session::startup_selection::selected_settings_candidate::tests::selected_candidate_uses_retained_baseline_and_sparse_tier_precedence', 'session::startup_selection::selected_settings_candidate::tests::standalone_skills_projection_retains_same_complete_box_and_original_model_owner', 'session::startup_selection::tests::original_startup_retains_effective_baseline_and_rejects_changed_selected_inputs', 'session::startup_selection::tests::retained_base_stays_startup_owned_across_first_command_personality_and_original_packet_adoption', 'session::startup_selection::tests::retained_startup_config_heap_storage_preserves_values_and_original_adoption', 'session::turn_input::tests::retained_tools_bind_only_actual_admitted_user_and_reject_automatic_or_recovery', 'session::turn_input_submission::tests::dropping_queued_typed_command_closes_original_waiter_without_replay', 'session::turn_input_submission::tests::dropping_same_original_submission_closes_waiter_and_waiter_loss_does_not_replay', 'session::turn_input_submission::tests::original_oneshot_preserves_routing_decisions_and_error_payloads', 'session::turn_input_submission::tests::protocol_wrapping_preserves_controls_recovery_and_legacy_turn_input', 'session::turn_input_submission::tests::same_opaque_command_and_complete_request_cross_actual_core_channel_once', 'session::turn_input_submission::tests::whole_request_all_modes_and_trace_move_once_into_original_core_submission', 'session::turn_user_input_data::tests::original_internal_projection_keeps_order_and_ignores_all_non_user_partitions', 'session::turn_user_input_data::tests::original_start_classification_rejects_reply_ids_other_items_and_mail_without_mutation', 'thread_manager::pre_session_skills::tests::original_thread_manager_captures_hidden_knowledge_and_native_model_without_startup', 'thread_manager::pre_session_skills::tests::shared_skills_body_retains_exact_model_arc_and_legacy_prompt_data', 'tools::spec_plan::tests::retained_actual_registry_iterator_associates_before_router_and_preserves_final_specs', 'tools::spec_plan::tests::retained_router_metadata_mismatch_burns_before_adapter_and_cannot_fall_back'}
          report = json.loads(Path('native-core-regression-list.json').read_text())
          observed = set()
          for suite in report['rust-suites'].values():
              if suite['package-name'] != 'codex-core' or suite['kind'] != 'lib' or suite['status'] != 'listed':
                  continue
              for name, case in suite['testcases'].items():
                  if not case['ignored'] and case['filter-match']['status'] == 'matches':
                      observed.add(name)
          if observed != expected:
              raise RuntimeError(f'Expected exact 51 Core regression cases, observed: {sorted(observed)}')
          PY_ORACLES
          oracle_status=0
          env -u CODEX_TEST_REALTIME_TLS_ADDRESS -u CODEX_TEST_REALTIME_TLS_TRUST \
            just test --lib -p codex-core -E "$native_oracle_filter" \
            --test-threads 1 --retries 0 2>&1 | tee native-core-regression-fixtures.log || oracle_status=$?
          if [[ -f target/nextest/local/junit.xml ]]; then
            mv target/nextest/local/junit.xml native-core-regression-junit.xml
          fi
          exit "$oracle_status"
      - name: Discover and run explicit extension library fixtures
        if: ${{ !cancelled() && steps.native_helpers.outcome == 'success' }}
        id: extension_libraries
        shell: bash
        working-directory: .native-prepared-source/codex-rs
        env:
          CARGO_NET_OFFLINE: 'true'
        run: |
          set -euo pipefail
          # Both original Cargo libraries use test=false. Explicit --lib selects
          # their real unit harnesses; the complete package suite remains below.
          library_status=0
          env -u CODEX_TEST_REALTIME_TLS_ADDRESS -u CODEX_TEST_REALTIME_TLS_TRUST \
            NEXTEST_PROFILE=local RUST_MIN_STACK=8388608 \
            cargo nextest list --lib -p codex-goal-extension -p codex-extension-api \
            --message-format json > native-extension-lib-list.json
          python3 - <<'PY_DISCOVERY'
          import json
          from pathlib import Path
          expected = {
              'codex-goal-extension': {
                  'extension::tool_selection_tests::goal_original_ordered_metadata_matches_real_executors_and_refuses_order_or_missing_tools',
                  'extension::tool_selection_tests::goal_visibility_and_persistence_keep_original_metadata_and_execution_policy_separate',
              },
              'codex-extension-api': {
                  'tool_pre_session::tests::source_plan_unknown_first_and_foreign_changed_source_config_refuse_without_tool_calls',
                  'tool_pre_session::tests::ordinary_config_renewal_retains_real_thread_start_source_and_legacy_forwarding',
              },
