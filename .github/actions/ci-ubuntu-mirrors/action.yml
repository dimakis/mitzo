name: Prepare Ubuntu package mirrors
description: Prefer independent HTTPS delivery of packages verified by Ubuntu's existing archive keys.
runs:
  using: composite
  steps:
    - name: Configure HTTPS Ubuntu mirrors
      if: runner.os == 'Linux'
      shell: bash
      run: |
        # Keep the image's Signed-By configuration and Ubuntu signature checks.
        # Independent DNS avoids making every browser job depend on ubuntu.com.
        sudo sed -i '\|^http://azure\.archive\.ubuntu\.com/ubuntu/|d' /etc/apt/apt-mirrors.txt
        sudo sed -i '1ihttps://mirrors.edge.kernel.org/ubuntu/' /etc/apt/apt-mirrors.txt
        grep -Fq 'https://archive.ubuntu.com/ubuntu/' /etc/apt/apt-mirrors.txt
        grep -Fq 'https://security.ubuntu.com/ubuntu/' /etc/apt/apt-mirrors.txt
        apt-config dump Acquire::Retries Acquire::http::Timeout Acquire::https::Timeout
