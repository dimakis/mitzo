name: Prepare HTTPS Ubuntu package mirrors
description: Retain the runner's official Azure mirror over HTTPS alongside archive and security fallbacks.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        sudo sed -i 's|^http://azure\.archive\.ubuntu\.com/ubuntu/|https://azure.archive.ubuntu.com/ubuntu/|' /etc/apt/apt-mirrors.txt
        grep -Fq 'https://azure.archive.ubuntu.com/ubuntu/' /etc/apt/apt-mirrors.txt
        grep -Fq 'https://archive.ubuntu.com/ubuntu/' /etc/apt/apt-mirrors.txt
        grep -Fq 'https://security.ubuntu.com/ubuntu/' /etc/apt/apt-mirrors.txt
        apt-config dump Acquire::Retries Acquire::http::Timeout Acquire::https::Timeout
