name: Prepare isolated canonical CLI and browser
description: Reuse hashed package downloads while keeping each job's Python environment and browser lifetime isolated.
runs:
  using: composite
  steps:
    # setup-python's macOS builds are not relocatable: they install under the
    # hosted image's runner home. Self-hosted runners use their own Python 3.13.
    - uses: actions/setup-python@v7
      if: runner.environment == 'github-hosted'
      with:
        python-version: '3.13'
        cache: pip
        cache-dependency-path: tests/integration/telos-s9/integrated-candidate/fixtures/mgmt-read-requirements.txt
    - shell: bash
      run: |
        if [ "$RUNNER_ENVIRONMENT" = github-hosted ]; then
          base_python=python
        else
          base_python=$(command -v python3.13 || true)
          if [ -z "$base_python" ]; then
            echo '::error::Self-hosted runner needs python3.13 on PATH for the canonical CLI'
            exit 1
          fi
        fi
        "$base_python" -c 'import sys; assert sys.version_info[:2] == (3, 13), sys.version'
        "$base_python" -m venv "$RUNNER_TEMP/telos-s9-python"
        "$RUNNER_TEMP/telos-s9-python/bin/python" -m pip install --require-hashes -r tests/integration/telos-s9/integrated-candidate/fixtures/mgmt-read-requirements.txt
        echo "S9_MGMT_PYTHON=$RUNNER_TEMP/telos-s9-python/bin/python" >> "$GITHUB_ENV"
    - uses: ./.github/actions/ci-playwright
      with:
        browsers: chromium
