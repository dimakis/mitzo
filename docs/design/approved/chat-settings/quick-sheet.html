      text-align: left;
      isolation: isolate;

    #mitzo-settings-exploration .mz-model-mark {
      display: inline-block;
      width: 17px;
      height: 17px;

      -webkit-mask: var(--mz-openai-mark) center/contain no-repeat;
      mask: var(--mz-openai-mark) center/contain no-repeat;
    }
    #mitzo-settings-exploration .mz-model-mark--claude {
      background: light-dark(#ae5c45, #df9b82);

      mask-image: var(--mz-claude-mark);
    }
    #mitzo-settings-exploration .mz-choice-identity {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    #mitzo-settings-exploration .mz-row .mz-add {
      color: var(--mz-accent);
    }
    #mitzo-settings-exploration .mz-section-label {
      font-size: 10px;

    }
    #mitzo-settings-exploration .mz-divider {

      background: var(--mz-line);

      font-size: 12px;
      color: var(--mz-muted);
      margin: 12px 0 17px;

      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-shrink: 0;
      border-top: 1px solid var(--mz-line);
      background: var(--mz-surface);
    }
    #mitzo-settings-exploration .mz-footer-note {
      font-size: 11px;
      color: var(--mz-muted);
    }
    #mitzo-settings-exploration .mz-product .mz-primary {
      background: var(--mz-accent);
      color: var(--mz-on-accent);
      min-width: 90px;
      padding: 10px 17px;
    }
    #mitzo-settings-exploration .mz-product .mz-primary:hover {
      filter: brightness(0.95);
      background: var(--mz-accent);
    }
    #mitzo-settings-exploration .mz-product .mz-secondary {
      border: 1px solid var(--mz-line);
      padding: 9px 13px;
      min-height: 44px;
    }
    #mitzo-settings-exploration .mz-product .mz-text-action {
      color: var(--mz-accent);
      padding-inline: 0;
      justify-content: flex-start;
    }
    #mitzo-settings-exploration .mz-actions {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      margin: 12px 0 6px;
    }
    #mitzo-settings-exploration .mz-choices {
      display: flex;
      flex-direction: column;
    }
    #mitzo-settings-exploration .mz-choice {
      min-height: 58px !important;
      width: 100%;
      padding: 12px 0 !important;
      justify-content: space-between !important;
      border-radius: 0 !important;
      border-bottom: 1px solid var(--mz-line) !important;
    }
    #mitzo-settings-exploration .mz-choice > span {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    #mitzo-settings-exploration .mz-choice small {
      color: var(--mz-muted);
      font-size: 11px;
    }
    #mitzo-settings-exploration .mz-choice[aria-pressed='true'] > svg {
      color: var(--mz-accent);
    }
    #mitzo-settings-exploration .mz-choice[aria-pressed='false'] > svg {
      opacity: 0;
    }
    #mitzo-settings-exploration .mz-segment {
      display: flex;
      gap: 3px;
      border: 1px solid var(--mz-line);
      border-radius: 10px;
      padding: 3px;
      background: var(--mz-bg);
      margin: 8px 0 13px;
    }
    #mitzo-settings-exploration .mz-segment button {
      flex: 1;
      padding: 7px;
      min-width: 0;
      justify-content: center;
    }
    #mitzo-settings-exploration .mz-segment button[aria-pressed='true'] {
      background: var(--mz-accent-fill);
      color: var(--mz-accent);
    }
    #mitzo-settings-exploration .mz-field {
      display: flex;
      flex-direction: column;
      gap: 7px;
      margin: 15px 0;
      font-size: 12px;
      color: var(--mz-muted);

    #mitzo-settings-exploration .mz-field select,
    #mitzo-settings-exploration .mz-field input,
    #mitzo-settings-exploration .mz-field textarea {
      font-size: 16px;
      color: var(--mz-text);
      width: 100%;
      min-height: 44px;
      border: 1px solid var(--mz-line);
      border-radius: 9px;
      padding: 10px 11px;
      background: var(--mz-bg);
    }
    #mitzo-settings-exploration .mz-field textarea {
      min-height: 104px;
      resize: vertical;
    }
    #mitzo-settings-exploration .mz-inline-field {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: var(--mz-row);
      gap: 12px;
      border-bottom: 1px solid var(--mz-line);
    }
    #mitzo-settings-exploration .mz-inline-field > span {
      font-size: 13px;
      color: var(--mz-muted);
    }
    #mitzo-settings-exploration .mz-inline-field select {
      min-width: 0;
      max-width: 70%;
      min-height: 44px;
      border: 0;
      background: transparent;
      color: var(--mz-text);
      text-align: right;
      padding: 8px 0 8px 8px;
      font-size: 14px;
    }
    #mitzo-settings-exploration .mz-inline-field select option {
      background: var(--mz-surface);
      color: var(--mz-text);
    }
    #mitzo-settings-exploration .mz-paired {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 16px;
    }
    #mitzo-settings-exploration .mz-note {
      color: var(--mz-muted);
      font-size: 12px;
      margin: 10px 0;
      line-height: 1.55;
    }
    #mitzo-settings-exploration .mz-note:empty {
      display: none;
    }
    #mitzo-settings-exploration .mz-lock {
      display: flex;
      gap: 7px;
      align-items: flex-start;
      font-size: 11px;
      color: var(--mz-muted);
      padding: 12px 0 6px;
    }
    #mitzo-settings-exploration .mz-lock svg {
      width: 13px;
      height: 16px;
    }

      gap: 12px;
      font-size: 12px;

      color: var(--mz-muted);
    }
    #mitzo-settings-exploration .mz-detail-list dd {
      margin: 0;
      text-align: right;
      overflow-wrap: anywhere;
    }

      gap: 20px;
      padding: 0 20px;
      border-bottom: 1px solid var(--mz-line);
      flex-shrink: 0;
    }
    #mitzo-settings-exploration .mz-tabs button {

      border-radius: 0;
      padding: 10px 0;
      position: relative;
      color: var(--mz-muted);

      color: var(--mz-text);

      right: 16px;

      color: var(--mz-text);
      border: 1px solid var(--mz-line);
      border-radius: 10px;
      box-shadow: 0 5px 20px var(--mz-shadow);

            return;
          }
          if (action === 'save-default') {
            s.savedDefault = true;
            render(product, true);
            toast(product, 'Default saved for new chats in this preview.');
          } else if (action === 'clear-default') {
            s.savedDefault = false;
            render(product, true);
            toast(product, 'New chats will ask you to choose an account.');
          } else if (action === 'refresh-models')
            toast(product, 'Model list refreshed. Your choices are kept.');
          else if (action === 'confirm-account') {
            s.view = 'main';
            render(product);
          } else if (action === 'check-web')
            toast(
              product,
              s.bound
                ? 'Web-access controls checked in this preview.'
                : 'Web access is checked after your first message.',
            );
          else if (action === 'refresh-execution')
            toast(product, 'Execution choices refreshed in this preview.');
          else if (action === 'review-execution') {
            if (s.bound) {
              s.bound = false;
              look.existing = false;
              s.view = 'main';
              render(product);
              toast(product, 'A separate new-chat setup. The original chat is kept.');
            } else {
              s.view = 'main';
              render(product);
              toast(product, `Run on ${s.runtime}.`);
            }
          } else if (action === 'preview-repository') {
            s.repoStage = 'preview';
            render(product, true);
          } else if (action === 'prepare-repository') {
            s.repoStage = 'ready';
            s.repository = s.repositoryInput;
            render(product, true);
            toast(product, 'Repository preparation previewed. No source was downloaded.');
          } else if (action === 'remove-repository') {
            s.repository = '';
            s.repositoryInput = '';
            s.repoStage = 'none';
            s.view = 'main';
            render(product);
          } else if (action === 'refresh-repository')
            toast(product, 'Preparation status: ready in this preview.');
          else if (action === 'close-session') {
            s.open = false;
            render(product);
            toast(product, 'Close-session flow previewed. No real session was closed.');
          } else if (action === 'save-alias') {
            const alias = product.querySelector('[data-field=alias]')?.value.trim();
            if (alias) toast(product, `Display-name change previewed: ${alias}.`);
          } else if (action === 'new-chat') {
            s.bound = false;
            look.existing = false;
            s.open = false;
            render(product);
            toast(product, 'Fresh chat. Your original conversation stays in Chats.');
          } else if (action === 'send') {
            const input = product.querySelector('textarea[aria-label="Message Mitzo"]');
            if (input.value.trim()) {
              s.bound = true;
              look.existing = true;
              render(product);
              toast(product, 'First-message flow previewed. No message was sent.');
            } else input.focus();
          } else if (action === 'insert-command') {
            s.open = false;
            render(product);
            const input = product.querySelector('textarea[aria-label="Message Mitzo"]');
            input.value = button.dataset.name + ' ';
            input.focus();
          } else if (action === 'add-agent') {
            go(product, 'library');
          } else if (action === 'create-agent') {
            go(product, 'profiles');
          } else if (action === 'resource-tab')
            toast(product, `${button.dataset.name} opens here. Your current settings are kept.`);
          else if (action === 'record-voice')
            toast(product, 'Voice-input control previewed. Microphone is not activated.');
          else if (action === 'publish-profile')
            toast(product, 'Publish action previewed. No agent was published.');
          else if (action === 'save-profile')
            toast(product, 'Draft action previewed. No agent was saved.');
          else if (action === 'check-review') toast(product, 'No review findings yet.');
          else if (action === 'nav' || action === 'chat-back')
            toast(
              product,
              `${button.dataset.name || 'Chats'} opens without losing your chat draft.`,
            );
          else if (action === 'copy-details')
            toast(product, 'Session-details copy action previewed.');
          else if (action === 'context-details')
            toast(product, 'Context details open without leaving this conversation.');
          else if (action === 'manage-github')
            toast(product, 'Manage allowed repositories in Connections.');
          persist();
        });
        product.addEventListener('change', (event) => {
          const field = event.target.dataset.field;
          if (!field) return;
          if (field === 'repositoryUrl') {
            s.repositoryInput = event.target.value;
            s.repoStage = 'none';
            render(product, true);
          } else if (
            [
              'account',
              'model',
              'thinking',
              'agent',
              'voice',
              'profileName',
              'profileInstructions',
            ].includes(field)
          ) {
            s[field] = event.target.value;
            if (field === 'account') s.model = (accountModels[s.account] || models)[0];
            if (!field.startsWith('profile')) render(product, true);
          }
          persist();
        });
        product.addEventListener('keydown', (event) => {
          if (event.key === 'Escape' && s.open) {
            event.preventDefault();
            if (s.view !== 'main') {
              s.view = 'main';
              render(product);
            } else {
              s.open = false;
              render(product);
              product.querySelector('[data-action=open-settings]').focus();
            }
            persist();
          }
        });
      });
      window.addEventListener('openai:set_globals', (event) => {
        if (event.detail?.globals?.widgetState) {
          applySaved(event.detail.globals.widgetState);
          products.forEach((product) => render(product));
        }
      });
    })();
  </script>
</div>
