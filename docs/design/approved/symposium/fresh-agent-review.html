      if(e.target.matches('[data-join-brief]')){state.dialog.brief=e.target.value;state.dialog.briefEdited=true;}
      if(e.target.matches('[data-delivery-note]'))state.dialog.note=e.target.value;
    });
    app.addEventListener('change',e=>{
      const d=state.dialog;if(!d)return;
      if(e.target.matches('[data-agent-policy]')){
        const c=current(),key=e.target.dataset.agentPolicy,id=e.target.value;
        if(c.mode==='directed'){c.readers=[];c.mode='shared';}
        c[key]=e.target.checked?[...new Set([...c[key],id])]:c[key].filter(v=>v!==id);
        if(!c.readers.length)c.mode='directed';
        render();persist();
        for(const prior of state.stack)if(prior.kind==='join-review'&&!prior.briefEdited){prior.brief='';prior.brief=joinBrief(prior);}
      }
      if(e.target.matches('[data-join-share]')){const id=e.target.dataset.joinShare;d.share=e.target.checked?[...new Set([...d.share,id])]:d.share.filter(v=>v!==id);}
      if(e.target.matches('[data-delivery-target]')){const id=e.target.dataset.deliveryTarget;d.targets=e.target.checked?[...new Set([...d.targets,id])]:d.targets.filter(v=>v!==id);q('[data-action="confirm-delivery"]').disabled=!d.targets.length;}
      if(e.target.matches('[data-forward-attachment]'))d.includeArtifact=e.target.checked;
      if(e.target.matches('[data-request-reply]'))d.reply=e.target.checked;
      if(e.target.matches('[data-artifact-version]')){d.version=Number(e.target.value);renderDialog();}
    });

    q('[data-mentions]').id='work-mention-picker-'+index;
    q('[data-message]').setAttribute('aria-controls',q('[data-mentions]').id);
    q('[data-message]').setAttribute('aria-haspopup','dialog');
    function hideMentions(){state.mention=null;state.mentionSelected=[];q('[data-mentions]').hidden=true;}
    function mentionOptions(){if(!state.mention)return[];return[{id:'all',alias:'all',name:'All agents',icon:'users'},...members()].filter(a=>`${a.alias} ${a.name}`.toLowerCase().includes(state.mention.query.toLowerCase()));}
    function renderMentions(){const focused=document.activeElement?.dataset?.mentionPick;const list=mentionOptions();q('[data-mentions]').hidden=false;q('[data-mention-options]').innerHTML=list.length?list.map((a,i)=>`<label class="mention-option ${i===state.mentionFocus?'is-active':''}"><input type="checkbox" data-mention-pick="${a.id}" ${state.mentionSelected.includes(a.id)?'checked':''}><span class="avatar">${icon(a.icon)}</span><span class="copy"><strong>@${esc(a.alias)}</strong><small>${esc(a.name)}${a.account?' · '+esc(a.account):''}</small></span></label>`).join(''):'<div class="empty">No matching agents</div>';q('[data-action="apply-mentions"]').disabled=!state.mentionSelected.length;icons();if(focused)q('[data-mention-options] [data-mention-pick="'+focused+'"]')?.focus();}
    function detectMention(){const input=q('[data-message]'),before=input.value.slice(0,input.selectionStart);const match=before.match(/(?:^|\s)@([a-zA-Z0-9_-]*)$/);if(!match){hideMentions();return;}const start=before.length-match[1].length-1;if(!state.mention||state.mention.start!==start){state.mentionSelected=[];state.mentionFocus=0;}state.mention={start,end:input.selectionStart,query:match[1]};state.mentionFocus=Math.min(state.mentionFocus,Math.max(0,mentionOptions().length-1));renderMentions();}
    function insertMentions(ids){if(!state.mention||!ids.length)return;const input=q('[data-message]'),m=state.mention,text=ids.map(id=>'@'+(id==='all'?'all':agent(id).alias)).join(' ')+' ';input.value=input.value.slice(0,m.start)+text+input.value.slice(m.end);current().draft=input.value;hideMentions();input.focus();input.setSelectionRange(m.start+text.length,m.start+text.length);persist();}
    function openConversation(id){if(!conversation(id))return;current().draft=q('[data-message]').value;state.conversation=id;state.route='chat';state.notice='';close();hideMentions();render();persist();}
    function openWork(id){if(!work(id))return;close();state.route='work';state.work=id;state.workTab='overview';state.collection='outcomes';render();persist();}
    app.addEventListener('click',e=>{
      if(Date.now()<(state.suppressClickUntil||0)&&state.suppressedPreviewTarget?.contains(e.target)){e.preventDefault();return;}
      if(e.target===q('[data-overlay]')){close();return;}const b=e.target.closest('button[data-action]');if(!b||b.disabled)return;const action=b.dataset.action,id=b.dataset.id,nested=!!state.dialog;
      if(action==='close'||action==='back-or-close'){if(state.stack.length)back();else close();}
      else if(action==='agents')open('agents',{},nested);
      else if(action==='add-agent')open('add-agent',{},nested);
      else if(action==='add-fresh'){const d=state.dialog;if(validateSetup(d,false))open('join-review',{fresh:structuredClone(d.form),share:[...d.form.share],contextSnapshot:captureContext(d.form)},true);}
      else if(action==='agent-details')open('agent-details',{id},nested);
      else if(action==='preview-agent')open('preview',{conversation:agent(id).origin},nested);
      else if(action==='preview-conversation')open('preview',{conversation:id},nested);
      else if(action==='open-conversation')openConversation(id);
      else if(action==='conversation-details')open('conversation-details');
      else if(action==='save-title'){current().title=q('[data-chat-name]').value.trim()||current().title;close();render();persist();}
      else if(action==='remove-agent')open('remove-agent',{id},true);
      else if(action==='confirm-remove'){current().agents=current().agents.filter(a=>a!==id);if(agent(id)?.sharedConversation===current().id)agent(id).sharedConversation=null;current().readers=current().readers.filter(v=>v!==id);current().responders=current().responders.filter(v=>v!==id);close();render();persist();}
      else if(action==='linked-work')open(current().works.length?'linked-work':'save-work');
      else if(['save-work','link-outcome','capture-outcome','save-artifact','artifact','access','resources','usage','tools','commands','terminal','appearance','boot','pr'].includes(action))open(action,{id},nested);
      else if(action==='resource-tab'){state.dialog.tab=b.dataset.tab;renderDialog();}
      else if(action==='usage-tab'){state.dialog.id=id;renderDialog();}
      else if(action==='terminal-agent')open('terminal',{id},true);
      else if(action==='command-insert'){const input=q('[data-message]'),start=input.selectionStart||0,end=input.selectionEnd||start;current().draft=input.value.slice(0,start)+b.dataset.command+input.value.slice(end);close();render();input.focus();input.setSelectionRange(start+b.dataset.command.length,start+b.dataset.command.length);persist();}
      else if(action==='open-work')openWork(id);
      else if(action==='work-home'){close();state.route='work';state.work=null;render();persist();}
      else if(action==='work-collection'){state.collection=b.dataset.tab;state.work=null;renderWork();icons();persist();}
      else if(action==='work-tab'){state.workTab=b.dataset.tab;renderWork();icons();}
      else if(action==='work-list'){state.work=null;renderWork();icons();}
      else if(action==='chat-current'){state.route='chat';render();}
      else if(action==='confirm-link-work'){if(!current().works.includes(id))current().works.push(id);close();state.notice='Conversation linked to '+work(id).title+'.';render();persist();}
      else if(action==='confirm-outcome'){const title=q('[data-outcome="title"]').value.trim(),intent=q('[data-outcome="intent"]').value.trim(),criteria=q('[data-outcome="criteria"]').value.split('\n').map(s=>s.trim()).filter(Boolean);if(!title||!intent||!criteria.length){q('[data-outcome="title"]').focus();return;}const id='captured'+(++state.newCount);state.works.push({id,title,telos:'New outcome preview',focus:false,status:'Active',intent,why:'Captured explicitly from this conversation.',criteria,milestones:[['Review the outcome',false]],next:'Review the captured outcome.'});current().works.push(id);openWork(id);}
      else if(action==='confirm-artifact'){const title=q('[data-artifact="title"]').value.trim(),content=q('[data-artifact="content"]').value.trim(),workId=q('[data-artifact="work"]').value;if(!title||!content)return;const a={id:'saved'+(++state.newCount),title,revision:1,filename:'review-notes.md',work:workId,origin:current().id,status:'Saved',content};state.artifacts.push(a);open('artifact',{id:a.id});persist();}
      else if(action==='chats')open('chats');
      else if(action==='new-chat')open('new-chat-setup',{form:initialDefaults()});
      else if(action==='fork-conversation'){const context=captureContext({context:'Conversation so far',share:[]},id);open('new-chat-setup',{form:initialDefaults(),fork:{conversation:current().id,title:current().title,context}},true);}
      else if(action==='create-chat')createConfiguredChat();
      else if(action==='send')send();
      else if(action==='edit-queue'){current().draft=state.queue;state.queue='';current().queue='';render();q('[data-message]').focus();}
      else if(action==='close-mentions')hideMentions();
      else if(action==='apply-mentions')insertMentions(state.mentionSelected);
      else if(action==='voice'){if(state.voice){clearInterval(state.voiceTimer);state.voice=false;current().draft+=(current().draft?' ':'')+state.voiceText;q('[data-voice]').hidden=true;render();persist();}else{state.voice=true;state.voiceText='';q('[data-voice]').hidden=false;const words='Let’s keep the plan and the conversation linked to the work.'.split(' ');let n=0;state.voiceTimer=setInterval(()=>{if(n<words.length){state.voiceText+=(n?' ':'')+words[n++];q('[data-voice]').textContent=state.voiceText;}else clearInterval(state.voiceTimer);},240);}}
      else if(action==='home'||action==='inbox')open('destination',{title:action==='home'?'Today':'Inbox'});
    });
    app.addEventListener('input',e=>{
      if(e.target.matches('[data-message]')){current().draft=e.target.value;detectMention();q('[data-action="send"]').setAttribute('aria-label',state.busy?(current().draft.trim()?'Queue message':'Interrupt agents'):'Send message');q('[data-action="send"]').innerHTML=icon(state.busy?(current().draft.trim()?'list-plus':'square'):'send-horizontal');icons();persist();}
      if(e.target.matches('[data-fresh="alias"],[data-fresh="purpose"]')&&state.dialog?.form)state.dialog.form[e.target.dataset.fresh]=e.target.value;
    });
    app.addEventListener('change',e=>{
      if(e.target.matches('[data-fresh]')){const f=state.dialog.form,key=e.target.dataset.fresh;f[key]=e.target.value;if(key==='account'){const config=accounts[f.account];f.model=config.models[0];f.thinking=config.thinking[0];f.runtime=config.runtimes[0];}if(key==='profile')f.alias=uniqueAlias(f.profile==='Code reviewer'?'Reviewer':f.profile==='Research'?'Research':'Mitzo');if(!['alias','purpose'].includes(key))renderDialog();}
      if(e.target.matches('[data-share]')){const f=state.dialog.form;f.share=e.target.checked?[...new Set([...f.share,e.target.dataset.share])]:f.share.filter(v=>v!==e.target.dataset.share);}
      if(e.target.matches('[data-mention-pick]')){const id=e.target.dataset.mentionPick;if(id==='all')state.mentionSelected=e.target.checked?['all']:[];else{state.mentionSelected=state.mentionSelected.filter(v=>v!=='all'&&v!==id);if(e.target.checked)state.mentionSelected.push(id);}renderMentions();}
      if(e.target.matches('[data-appearance]')){state[e.target.dataset.appearance]=e.target.value;applyAppearance();persist();}
    });
    q('[data-dialog-back]').addEventListener('click',back);
    app.addEventListener('keydown',e=>{
      if(state.mention&&e.key==='Escape'){e.preventDefault();hideMentions();q('[data-message]').focus();return;}
      if(state.mention&&e.target.matches('[data-mention-pick]')&&e.key==='Enter'){e.preventDefault();insertMentions(state.mentionSelected.length?state.mentionSelected:[e.target.dataset.mentionPick]);return;}
      if(state.mention&&e.target===q('[data-message]')){
        if(e.key==='Tab'&&!e.shiftKey){e.preventDefault();q('[data-mention-options] input')?.focus();return;}
        if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();const n=mentionOptions().length;state.mentionFocus=n?(state.mentionFocus+(e.key==='ArrowDown'?1:-1)+n)%n:0;renderMentions();q('[data-mention-options]').children[state.mentionFocus]?.scrollIntoView({block:'nearest'});return;}
        if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();const focused=mentionOptions()[state.mentionFocus];insertMentions(state.mentionSelected.length?state.mentionSelected:focused?[focused.id]:[]);return;}
      }
      if(!state.mention&&e.target===q('[data-message]')&&e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();send();return;}
      if(state.dialog&&e.key==='Escape'){e.preventDefault();if(state.stack.length)back();else close();}
      if(state.dialog&&e.key==='Tab'){const nodes=Array.from(q('[data-overlay] [role="dialog"]').querySelectorAll('button:not([disabled]),input:not([disabled]),select,textarea,a[href]')).filter(el=>el.getClientRects().length);const first=nodes[0],last=nodes.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus();}}
    });
    function previewTarget(target){const m=target.closest('[data-message-id]');if(m){open('message-actions',{id:m.dataset.messageId},!!state.dialog);return true;}const a=target.closest('[data-preview-agent]'),c=target.closest('[data-preview-conversation]');if(a)open('preview',{conversation:agent(a.dataset.previewAgent).origin},!!state.dialog);else if(c)open('preview',{conversation:c.dataset.previewConversation},!!state.dialog);return!!(a||c);}
    app.addEventListener('contextmenu',e=>{if(e.target.closest('[data-message-id],[data-preview-agent],[data-preview-conversation]')){e.preventDefault();previewTarget(e.target);}});
    let pressTimer,pressPoint;
    app.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'||!e.target.closest('[data-message-id],[data-preview-agent],[data-preview-conversation]'))return;pressPoint={x:e.clientX,y:e.clientY};const target=e.target;pressTimer=setTimeout(()=>{state.suppressClickUntil=Date.now()+350;state.suppressedPreviewTarget=target.closest('[data-message-id],[data-preview-agent],[data-preview-conversation]');previewTarget(target);},550);});
    app.addEventListener('pointermove',e=>{if(pressPoint&&Math.hypot(e.clientX-pressPoint.x,e.clientY-pressPoint.y)>8)clearTimeout(pressTimer);});
    for(const type of ['pointerup','pointercancel'])app.addEventListener(type,()=>{clearTimeout(pressTimer);pressPoint=null;});
    window.addEventListener('openai:set_globals',e=>{const view=e.detail?.globals?.widgetState?.privateContent?.views?.[index];if(!view)return;if(['mint','teal','lavender','rose','amber','blue','coral','plum'].includes(view.accent))state.accent=view.accent;if(['georgia','system'].includes(view.font))state.font=view.font;if(['System','Light','Dark'].includes(view.appearance))state.appearance=view.appearance;restorePolicies(view);applyAppearance();render();});
    render();open('add-agent',{form:freshDefaults()});
    if(globalThis.Tweak){const tweak=new Tweak({container:app,onChange:()=>{applyAppearance();render();if(state.dialog)renderDialog();}});tweak.addSelect(state,'appearance',{label:'Theme',options:['System','Light','Dark']});tweak.addSelect(state,'accent',{label:'Settings accent',options:['mint','teal','lavender','rose','amber','blue','coral','plum']});tweak.addSelect(state,'font',{label:'Settings font',options:['georgia','system']});tweak.addToggle(state,'unavailable',{label:'Reviewer unavailable'});}
  });icons();
})();
</script>
