# Disposable, workspace-scoped provider profile. It gives OpenShell the
# endpoint and bearer-header metadata absent from the legacy `openai` type.
id: mitzo-openai-keychain-spike
resource_version: 1
display_name: Mitzo OpenAI Keychain Spike
description: Inspectable OpenAI Responses API provider for the disposable Mitzo spike
category: inference
inference_capable: true
credentials:
  - name: api_key
    description: OpenAI API key
    env_vars: [OPENAI_API_KEY]
    required: true
    auth_style: bearer
    header_name: authorization
endpoints:
  - host: api.openai.com
    port: 443
    protocol: rest
    access: read-write
    enforcement: enforce
  - host: api.openai.com
    port: 443
    path: /v1/responses
    protocol: websocket
    enforcement: enforce
    rules:
      - allow: { method: GET, path: /v1/responses }
      - allow: { method: WEBSOCKET_TEXT, path: /v1/responses }
binaries:
  - /usr/bin/curl
  - /usr/bin/codex
  - /usr/bin/node
  - /usr/lib/node_modules/@openai/**
