# Adapted from NVIDIA/OpenShell 1905069948f96921daf88bffb160dceb9ac2a307,
# examples/codex-app-server/codex.yaml (Apache-2.0).
# Disposable development profile. Import/provision only through explicit admission.
id: codex
display_name: Symposium native subscription
description: Codex ChatGPT subscription with gateway-owned OAuth refresh
category: agent
inference_capable: true
credentials:
  - name: access_token
    env_vars: [CODEX_AUTH_ACCESS_TOKEN]
    required: true
    auth_style: bearer
    header_name: authorization
    refresh:
      strategy: oauth2_refresh_token
      token_url: https://auth.openai.com/oauth/token
      refresh_before_seconds: 300
      max_lifetime_seconds: 3600
      material:
        - name: client_id
          required: true
        - name: refresh_token
          required: true
          secret: true
  - name: account_id
    env_vars: [CODEX_AUTH_ACCOUNT_ID]
    required: true
discovery:
  credentials: [access_token, account_id]
endpoints:
  - host: chatgpt.com
    port: 443
    protocol: rest
    access: read-write
    enforcement: enforce
  - host: auth.openai.com
    port: 443
    protocol: rest
    access: read-write
    enforcement: enforce
  - host: ab.chatgpt.com
    port: 443
    protocol: rest
    access: read-write
    enforcement: enforce
binaries: [/usr/bin/codex]
