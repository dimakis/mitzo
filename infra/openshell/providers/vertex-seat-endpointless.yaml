# Workspace-scoped override for the built-in google-vertex-ai profile. Import
# into the Symposium workspace before creating or attaching its Vertex provider.
# Endpointless credentials are withheld until a sandbox policy names the exact
# provider in credential_binding. Do not import this as a global profile.
id: google-vertex-ai
display_name: Symposium Vertex seat credential
description: Vertex token for sandbox-specific, model-specific policy binding
category: inference
inference_capable: true
credentials:
  - name: service_account_key
    description: Google service account JSON refresh bootstrap material; gateway only
    env_vars: [GOOGLE_SERVICE_ACCOUNT_KEY]
    required: false
  - name: service_account_token
    description: Google Cloud access token refreshed from service account JWT material
    env_vars: [GOOGLE_VERTEX_AI_SERVICE_ACCOUNT_TOKEN, VERTEX_AI_SERVICE_ACCOUNT_TOKEN]
    required: false
    auth_style: bearer
    header_name: authorization
    refresh:
      strategy: google_service_account_jwt
      token_url: https://oauth2.googleapis.com/token
      scopes: [https://www.googleapis.com/auth/cloud-platform]
      refresh_before_seconds: 300
      max_lifetime_seconds: 3600
      material:
        - { name: client_email, required: true }
        - { name: private_key, required: true, secret: true }
        - { name: subject }
  - name: gcloud_adc_token
    description: Google Cloud access token refreshed via gcloud ADC
    env_vars: [GOOGLE_VERTEX_AI_TOKEN, VERTEX_AI_TOKEN]
    required: false
    auth_style: bearer
    header_name: authorization
    refresh:
      strategy: oauth2_refresh_token
      token_url: https://oauth2.googleapis.com/token
      scopes: [https://www.googleapis.com/auth/cloud-platform]
      refresh_before_seconds: 300
      max_lifetime_seconds: 3600
      material:
        - { name: client_id, required: true }
        - { name: client_secret, required: true, secret: true }
        - { name: refresh_token, required: true, secret: true }
discovery:
  credentials: [service_account_token, gcloud_adc_token]
endpoints: []
