version: 1
filesystem_policy:
  include_workdir: false
  read_only: [/usr, /lib, /proc, /dev/urandom, /etc]
  read_write: [/tmp, /dev/null]
landlock:
  compatibility: best_effort
network_policies:
  jira_identity:
    name: jira-identity-readonly
    endpoints:
      - host: redhat.atlassian.net
        port: 443
        protocol: rest
        access: read-only
        enforcement: enforce
        tls: terminate
    binaries:
      - { path: /usr/bin/python3 }
