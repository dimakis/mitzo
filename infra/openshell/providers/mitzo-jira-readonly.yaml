id: jira-readonly
resource_version: 1
display_name: Mitzo Jira read-only
description: User-supplied Jira API token for an approved read-only endpoint
category: data
inference_capable: false
credentials:
  - name: api_token
    description: Jira API token supplied at connection time
    env_vars: [JIRA_API_TOKEN]
    required: true
    auth_style: basic
    header_name: authorization
endpoints:
  - host: api.atlassian.com
    port: 443
    protocol: rest
    enforcement: enforce
    tls: terminate
    rules:
      - allow: { method: GET, path: /ex/jira/2b9e35e3-6bd3-4cec-b838-f4249ee02432/rest/api/2/** }
      - allow: { method: HEAD, path: /ex/jira/2b9e35e3-6bd3-4cec-b838-f4249ee02432/rest/api/2/** }
      - allow: { method: GET, path: /ex/jira/2b9e35e3-6bd3-4cec-b838-f4249ee02432/rest/api/3/** }
      - allow: { method: HEAD, path: /ex/jira/2b9e35e3-6bd3-4cec-b838-f4249ee02432/rest/api/3/** }
binaries:
  - /usr/bin/python3
  - /usr/bin/curl
  - /usr/local/bin/curl
